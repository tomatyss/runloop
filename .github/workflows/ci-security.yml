name: CI Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1' # Mondays at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: Dependency Audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  licenses:
    name: License & Bans (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run cargo-deny checks
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
          arguments: advisories bans licenses sources
        # Keep green while policy stabilizes
        continue-on-error: true

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Guard to avoid conflict with GitHub CodeQL Default setup.
    # Run this advanced job only when the repository variable CI_CODEQL_ADVANCED is explicitly set to 'true'.
    # If you enable this, disable Default setup in the GitHub UI first to avoid SARIF rejection.
    if: ${{ vars.CI_CODEQL_ADVANCED == 'true' && (matrix.language != 'python' || hashFiles('**/*.py') != '' || hashFiles('**/*.pyi') != '' || hashFiles('**/*.pyw') != '') }}
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: ${{ matrix.language != 'python' }}
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
