name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks

      - name: Check disk space
        run: df -h

      - name: Prepare log directory
        run: mkdir -p artifacts

      - name: Cargo fmt
        run: |
          set -euo pipefail
          cargo fmt --all -- --check |& tee artifacts/fmt.log

      - name: Cargo clippy
        run: |
          set -euo pipefail
          cargo clippy --workspace --locked -- -D warnings |& tee artifacts/clippy.log

      - name: Cargo test
        run: |
          set -euo pipefail
          cargo test --workspace --locked |& tee artifacts/test.log

      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-checks-logs-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
