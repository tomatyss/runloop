name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Binaries (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: |
          set -euxo pipefail
          cargo build --locked --release -p rlp -p runloopd -p agtop

      - name: Package artifacts
        id: package
        run: |
          set -euxo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          TARGET_TRIPLE=x86_64-unknown-linux-gnu
          DIST=dist
          mkdir -p "$DIST"

          # Bundle individual binaries
          for BIN in rlp runloopd agtop; do
            OUTDIR="$DIST/${BIN}-${VERSION}-${TARGET_TRIPLE}"
            mkdir -p "$OUTDIR"
            cp "target/release/${BIN}" "$OUTDIR/"
            chmod +x "$OUTDIR/${BIN}"
            cp LICENSE README.md "$OUTDIR/" || true
            (cd "$DIST" && tar -czf "${BIN}-${VERSION}-${TARGET_TRIPLE}.tar.gz" "${BIN}-${VERSION}-${TARGET_TRIPLE}")
            rm -rf "$OUTDIR"
          done

          # Checksums
          (cd "$DIST" && sha256sum *.tar.gz > SHA256SUMS)

          echo "dist_dir=$DIST" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ github.ref_name }}
          path: ${{ steps.package.outputs.dist_dir }}/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ github.ref_name }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # TODO (future):
    # - Build and attach Debian packages (.deb)
    # - Build and push container image(s)
    # - Build live-build ISO
    # - Sign artifacts (cosign/minisign)
