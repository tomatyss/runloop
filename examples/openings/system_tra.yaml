version: 0
name: system_tra
goals:
  - "run the system_tra agent"
params:
  prompt: "example input"

policy:
  budget_tokens: 4000
  timeout_ms: 15000
  confirm_external: true

nodes:
  - id: system_tra_node
    use: agent:system_tra
    with:
      input: "{{params.prompt}}"
    timeout_ms: 10000

edges: []

success:
  any_of:
    - exists(system_tra_node.out)
