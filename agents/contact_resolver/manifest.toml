[agent]
name = "contact_resolver"
version = "0.1.0"
kind = "wasm32-wasip1"

entry_wasm = { path = "bin/contact_resolver.wasm", blake3 = "cda616e33107003fc2050b6e8aa6aaffecd3472adaa46d6fe05009538a5fe478" }

[ports]
in = ["intent.contact.lookup.v1"]
out = ["artifact.contact.resolved.v1"]

[caps]
file = "policy.caps"

[schemas.with]
type = "object"
additionalProperties = false

[schemas.with.properties.query]
type = "string"
minLength = 1

[schemas.with.properties.recipient_query]
type = "string"
minLength = 1

[[schemas.with.anyOf]]
required = ["query"]

[[schemas.with.anyOf]]
required = ["recipient_query"]
