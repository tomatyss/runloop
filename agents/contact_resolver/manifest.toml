[agent]
name = "contact_resolver"
version = "0.1.0"
kind = "native-shim"

entry_native = { path = "bin/contact_resolver", blake3 = "89e6f1fe99b70d441c1a78949ce2193e50553f75bba636461b5f67a8a9cc7dfb" }

[ports]
in = ["intent.contact.lookup.v1"]
out = ["artifact.contact.resolved.v1"]

[caps]
