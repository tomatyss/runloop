[agent]
name = "contact_resolver"
version = "0.1.0"
kind = "wasm32-wasip1"

entry_wasm = { path = "bin/contact_resolver.wasm", blake3 = "0dbe824d920f5feeee66ffaad6be7999d50f3f9b164e058baa1c66b7e2956964" }

[ports]
in = ["intent.contact.lookup.v1"]
out = ["artifact.contact.resolved.v1"]

[caps]
file = "policy.caps"

[artifacts.tools]
path = "tools.json"
blake3 = "62c56dc05fea3039501e5d21bc43f268757dbc7ccd1d8d7abd03f64607e6f547"
version = 1
[schemas.with]
type = "object"
additionalProperties = false

[schemas.with.properties.query]
type = "string"
minLength = 1

[schemas.with.properties.recipient_query]
type = "string"
minLength = 1

[[schemas.with.anyOf]]
required = ["query"]

[[schemas.with.anyOf]]
required = ["recipient_query"]
