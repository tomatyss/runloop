[agent]
name = "tmux_layout"
version = "0.1.0"
kind = "wasm32-wasip1"

entry_wasm = { path = "bin/tmux_layout.wasm", blake3 = "be3c39761ca51515cfeeca5f5a2db32fdd4d9894e881907e5fe86fa570724e11" }

[ports]
in = ["intent.tmux_layout.apply.v1"]
out = ["artifact.tmux_layout.result.v1"]

[caps]
file = "policy.caps"

[artifacts.tools]
path = "tools.json"
blake3 = "afe8c80ddd828a277fa440f6fc431158d0429d2300d322786613b962a831a3be"
version = 1
[schemas.with]
type = "object"
additionalProperties = false
required = ["preset"]

[schemas.with.properties.preset]
type = "string"
enum = ["sensible", "minimal", "stacked"]

[schemas.with.properties.tmux_conf]
type = "string"
minLength = 1

[schemas.with.properties.reload]
type = "boolean"

[schemas.with.properties.apply_layout]
type = "string"
minLength = 1

[schemas.with.properties.extra_lines]
type = "array"
items = { type = "string", minLength = 1 }
maxItems = 32
