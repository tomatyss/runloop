[workspace]
members = [
    "crates/agtop",
    "crates/bus",
    "crates/core",
    "crates/kb",
    "crates/model-broker",
    "crates/openings",
    "crates/rlp",
    "crates/rmp",
    "crates/runloopd",
    "crates/runtime",
    "crates/sdk"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
arrayvec = "0.7"
bitflags = { version = "2.4", features = ["serde"] }
blake3 = "1.5"
bytes = "1.6"
camino = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4"
humantime = "2.1"
indexmap = { version = "2.2", features = ["serde"] }
lru = "0.12"
once_cell = "1.19"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.9", features = ["json"] }
serde_yaml = "0.9"
smallvec = "1.13"
thiserror = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json"] }
walkdir = "2.5"
tempfile = "3.10"
rmp-serde = "1.3"
uuid = { version = "1.8", features = ["serde", "v7"] }
clap = { version = "4.5", features = ["derive"] }
