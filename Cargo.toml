[workspace]
members = [
  "crates/core",
  "crates/rmp",
  "crates/bus",
  "crates/runtime",
  "crates/kb",
  "crates/model-broker",
  "crates/agent-registry",
  "crates/openings",
  "crates/router",
  "crates/runloopd",
  "crates/rlp",
  "crates/agtop",
  "crates/executor-local",
  "crates/sdk/runloop-sdk",
  "crates/sdk/agent-shim", "crates/agents/common", "crates/agents/contact_resolver", "crates/agents/context_gatherer", "crates/agents/writer", "crates/agents/critic", "crates/agents/mailer", "crates/tools/b3sum",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_extern_crates = "deny"
unused_imports = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
panic = "warn"

[profile.dev]
incremental = true
debug = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.package]
license = "Apache-2.0"
