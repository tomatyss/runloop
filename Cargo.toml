[workspace]
members = [
  "crates/core",
  "crates/rmp",
  "crates/bus",
  "crates/runtime",
  "crates/kb",
  "crates/model-broker",
  "crates/openings",
  "crates/runloopd",
  "crates/rlp",
  "crates/agtop",
  "crates/sdk",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_extern_crates = "deny"
unused_imports = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = "allow"
nursery = "allow"
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
panic = "warn"

[profile.dev]
incremental = true
debug = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.package]
license = "Apache-2.0"
