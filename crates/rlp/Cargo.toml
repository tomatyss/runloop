[package]
name = "rlp"
version = "0.1.0"
edition = "2024"

[dependencies]
runloop-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
