[package]
name = "rlp"
version = "0.1.0"
edition = "2024"

[dependencies]
runloop-core = { path = "../core" }
runloop-router = { path = "../router" }
runloop-kb = { path = "../kb" }
runloop-openings = { path = "../openings" }
runloop-model-broker = { path = "../model-broker" }
runloop-executor-local = { path = "../executor-local" }
runloop-agents-common = { path = "../agents/common" }
runloop-bus = { path = "../bus" }
runloop-rmp = { path = "../rmp" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
serde_yaml = "0.9"
async-trait = "0.1"
tracing = "0.1"
dirs = "5.0"
is-terminal = "0.4"
terminal_size = "0.3"
textwrap = "0.16"
unicode-width = "0.1"
futures-util = "0.3"
bytes = "1.7"
fastrand = "2.0"
uuid = { version = "1", features = ["v4"] }
