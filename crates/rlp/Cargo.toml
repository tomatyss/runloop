[package]
name = "rlp"
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/runloop/runloop"

[dependencies]
runloop-core = { path = "../core" }
runloop-router = { path = "../router" }
runloop-kb = { path = "../kb" }
runloop-openings = { path = "../openings" }
runloop-model-broker = { path = "../model-broker" }
runloop-agent-registry = { path = "../agent-registry" }
runloop-executor-local = { path = "../executor-local" }
runloop-agents-common = { path = "../agents/common" }
runloop-bus = { path = "../bus" }
runloop-rmp = { path = "../rmp" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
serde_yaml = "0.9"
async-trait = "0.1"
tracing = "0.1"
dirs = "5.0"
is-terminal = "0.4"
terminal_size = "0.4"
textwrap = "0.16"
unicode-width = "0.2"
futures-util = "0.3"
bytes = "1.7"
fastrand = "2.0"
uuid = { version = "1", features = ["v4"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "Runloop Authors <ops@runloop.media>"
copyright = "2025 Runloop Authors"
license-file = "../../LICENSE"
priority = "optional"
section = "utils"
depends = "$auto, ca-certificates"
assets = [
    ["../../README.md", "usr/share/doc/rlp/README.md", "644"],
    ["../../docs/router-shell.md", "usr/share/doc/rlp/router-shell.md", "644"],
    ["../../docs/ops.md", "usr/share/doc/rlp/ops.md", "644"],
]
extended-description = """
The Runloop CLI submits openings, inspects the knowledge base, and drives router/shell integrations. It expects a reachable runloopd daemon (local socket or --local fallback).
"""
