[package]
name = "rlp"
version = "0.1.0"
edition = "2024"

[dependencies]
runloop-core = { path = "../core" }
runloop-router = { path = "../router" }
runloop-kb = { path = "../kb" }
runloop-openings = { path = "../openings" }
runloop-model-broker = { path = "../model-broker" }
runloop-executor-local = { path = "../executor-local" }
runloop-agents-common = { path = "../agents/common" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"
serde_yaml = "0.9"
async-trait = "0.1"
tracing = "0.1"
dirs = "5.0"
is-terminal = "0.4"
terminal_size = "0.3"
textwrap = "0.16"
unicode-width = "0.1"
