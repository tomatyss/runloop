[package]
name = "runloop-openings"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_openings"

[dependencies]
runloop-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
serde_spanned = "0.6"
thiserror = "1.0"
indexmap = "2"
async-trait = "0.1"
tokio = { version = "1.39", features = ["time", "sync", "rt", "macros"] }
rand = "0.8"
blake3 = "1.5"
