[package]
name = "runloop-model-broker"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_model_broker"

[dependencies]
runloop-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
thiserror = "1.0"
lru = "0.12"
