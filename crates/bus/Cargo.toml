[package]
name = "runloop-bus"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_bus"

[dependencies]
runloop-core = { path = "../core" }
runloop-rmp = { path = "../rmp" }
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
lru = "0.12"
tracing = "0.1"
