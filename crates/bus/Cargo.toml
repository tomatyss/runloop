[package]
name = "runloop-bus"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_bus"

[dependencies]
runloop-core = { path = "../core" }
runloop-rmp = { path = "../rmp" }
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
lru = "0.16"
tracing = "0.1"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = { version = "6", features = ["inline"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.24"
