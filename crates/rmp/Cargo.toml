[package]
name = "runloop-rmp"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_rmp"

[dependencies]
runloop-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
thiserror = "2.0"
bytes = "1.6"
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "io-util", "time"] }
