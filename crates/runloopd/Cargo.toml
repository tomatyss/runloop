[package]
name = "runloopd"
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/runloop/runloop"

[dependencies]
runloop-core = { path = "../core" }
runloop-kb = { path = "../kb" }
runloop-bus = { path = "../bus" }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
runloop-rmp = { path = "../rmp" }
runloop-openings = { path = "../openings" }
runloop-executor-local = { path = "../executor-local" }
runloop-agents-common = { path = "../agents/common" }
runloop-model-broker = { path = "../model-broker" }
runloop-agent-registry = { path = "../agent-registry" }
runloop-registry = { path = "../registry" }
runloop-runtime = { path = "../runtime" }
bytes = "1.7"
futures-util = "0.3"
async-trait = "0.1"
tempfile = "3.24"
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }

[package.metadata.deb]
maintainer = "Runloop Authors <ops@runloop.media>"
copyright = "2025 Runloop Authors"
license-file = "../../LICENSE"
priority = "optional"
section = "utils"
depends = "$auto, adduser, systemd (>= 255), ca-certificates"
assets = [
    ["target/release/runloopd", "usr/bin/", "755"],
    ["../../packaging/systemd/runloopd.service", "lib/systemd/system/runloopd.service", "644"],
    ["../../packaging/systemd/tmpfiles.d/runloop.conf", "usr/lib/tmpfiles.d/runloop.conf", "644"],
    ["../../packaging/systemd/config/config.yaml", "etc/runloop/config.yaml", "640"],
    ["../../examples/openings/compose_email.yaml", "etc/runloop/openings/compose_email.yaml", "644"],
    ["../../examples/openings/smoke_exec.yaml", "etc/runloop/openings/smoke_exec.yaml", "644"],
    ["../../packaging/systemd/README.Debian", "usr/share/doc/runloopd/README.Debian", "644"],
    ["../../README.md", "usr/share/doc/runloopd/README.md", "644"],
    ["../../docs/ops.md", "usr/share/doc/runloopd/ops.md", "644"],
    ["../../agents/contact_resolver/manifest.toml", "usr/lib/runloop/agents/contact_resolver/manifest.toml", "644"],
    ["../../agents/contact_resolver/policy.caps", "usr/lib/runloop/agents/contact_resolver/policy.caps", "644"],
    ["../../agents/contact_resolver/tools.json", "usr/lib/runloop/agents/contact_resolver/tools.json", "644"],
    ["../../agents/contact_resolver/README.md", "usr/lib/runloop/agents/contact_resolver/README.md", "644"],
    ["../../agents/contact_resolver/bin/contact_resolver.wasm", "usr/lib/runloop/agents/contact_resolver/bin/contact_resolver.wasm", "644"],
    ["../../agents/context_gatherer/manifest.toml", "usr/lib/runloop/agents/context_gatherer/manifest.toml", "644"],
    ["../../agents/context_gatherer/policy.caps", "usr/lib/runloop/agents/context_gatherer/policy.caps", "644"],
    ["../../agents/context_gatherer/tools.json", "usr/lib/runloop/agents/context_gatherer/tools.json", "644"],
    ["../../agents/context_gatherer/README.md", "usr/lib/runloop/agents/context_gatherer/README.md", "644"],
    ["../../agents/context_gatherer/bin/context_gatherer.wasm", "usr/lib/runloop/agents/context_gatherer/bin/context_gatherer.wasm", "644"],
    ["../../agents/writer/manifest.toml", "usr/lib/runloop/agents/writer/manifest.toml", "644"],
    ["../../agents/writer/policy.caps", "usr/lib/runloop/agents/writer/policy.caps", "644"],
    ["../../agents/writer/tools.json", "usr/lib/runloop/agents/writer/tools.json", "644"],
    ["../../agents/writer/README.md", "usr/lib/runloop/agents/writer/README.md", "644"],
    ["../../agents/writer/bin/writer.wasm", "usr/lib/runloop/agents/writer/bin/writer.wasm", "644"],
    ["../../agents/critic/manifest.toml", "usr/lib/runloop/agents/critic/manifest.toml", "644"],
    ["../../agents/critic/policy.caps", "usr/lib/runloop/agents/critic/policy.caps", "644"],
    ["../../agents/critic/tools.json", "usr/lib/runloop/agents/critic/tools.json", "644"],
    ["../../agents/critic/README.md", "usr/lib/runloop/agents/critic/README.md", "644"],
    ["../../agents/critic/bin/critic.wasm", "usr/lib/runloop/agents/critic/bin/critic.wasm", "644"],
    ["../../agents/mailer/manifest.toml", "usr/lib/runloop/agents/mailer/manifest.toml", "644"],
    ["../../agents/mailer/policy.caps", "usr/lib/runloop/agents/mailer/policy.caps", "644"],
    ["../../agents/mailer/tools.json", "usr/lib/runloop/agents/mailer/tools.json", "644"],
    ["../../agents/mailer/README.md", "usr/lib/runloop/agents/mailer/README.md", "644"],
    ["../../agents/mailer/bin/mailer.wasm", "usr/lib/runloop/agents/mailer/bin/mailer.wasm", "644"],
    ["../../agents/system_helper/manifest.toml", "usr/lib/runloop/agents/system_helper/manifest.toml", "644"],
    ["../../agents/system_helper/policy.caps", "usr/lib/runloop/agents/system_helper/policy.caps", "644"],
    ["../../agents/system_helper/README.md", "usr/lib/runloop/agents/system_helper/README.md", "644"],
    ["../../agents/system_helper/bin/system_helper.wasm", "usr/lib/runloop/agents/system_helper/bin/system_helper.wasm", "644"],
]
conf-files = [
    "etc/runloop/config.yaml",
    "etc/runloop/openings/compose_email.yaml",
    "etc/runloop/openings/smoke_exec.yaml",
]
maintainer-scripts = "../../packaging/systemd/scripts/runloopd"
extended-description = """
Runloop routes prompts through router+agent openings, schedules WASM agents via runloopd, and persists run and capability events. This package installs the daemon, default config, and systemd units for Debian trixie-class hosts.
"""
