[package]
name = "runloop-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
uuid = { version = "1.19", features = ["v4", "serde"] }
dirs = "6.0"
tracing = "0.1"
serde_json = "1.0"
shellexpand = "3.1"
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.10"
serde_yaml = "0.9"
tracing-subscriber = "0.3"
