[package]
name = "runloop-kb"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_kb"

[dependencies]
runloop-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
thiserror = "1.0"
parking_lot = "0.12"
blake3 = "1.5"
