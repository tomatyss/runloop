[package]
name = "runloop-kb"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_kb"

[dependencies]
runloop-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "backup"] }
thiserror = "2.0"
parking_lot = "0.12"
blake3 = "1.5"
jsonschema = "0.33"
json-canon = "0.1"
hex = "0.4"
runloop-openings = { path = "../openings" }
