[package]
name = "runloop-agent-contact-resolver"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
runloop-agents-common = { path = "../common" }
runloop-core = { path = "../../core" }
runloop-kb = { path = "../../kb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
