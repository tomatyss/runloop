[package]
name = "runloop-agent-writer"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
runloop-agents-common = { path = "../common" }
runloop-core = { path = "../../core" }
runloop-kb = { path = "../../kb" }
runloop-model-broker = { path = "../../model-broker" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
uuid = { version = "1.8", features = ["v4"] }

[lints]
workspace = true
