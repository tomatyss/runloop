[package]
name = "runloop-runtime"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_runtime"

[dependencies]
runloop-core = { path = "../core" }
runloop-rmp = { path = "../rmp" }
runloop-kb = { path = "../kb" }
runloop-model-broker = { path = "../model-broker" }
runloop-bus = { path = "../bus" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync"] }
tracing = "0.1"
bytes = "1.6"
parking_lot = "0.12"
once_cell = "1.19"
dashmap = "6"
async-trait = "0.1"
toml = { version = "0.8", features = ["parse"] }
directories = "6.0"
camino = "1.1"
cfg-if = "1.0"
serde_json = "1.0"
metrics = "0.24"
wasmtime = { version = "38.0.4", features = ["cache", "cranelift"] }
wasmtime-wasi = "38.0.4"
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["thread"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
futures-util = "0.3"
url = "2.5"
anyhow = "1.0"
blake3 = "1.5"
uuid = { version = "1.8", features = ["v4"] }
data-encoding = "2.6"


[features]
default = ["procfs"]
procfs = ["dep:procfs"]
no-procfs = []

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
wat = "1.241.2"
tempfile = "3.10"
