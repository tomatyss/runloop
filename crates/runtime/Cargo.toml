[package]
name = "runloop-runtime"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_runtime"

[dependencies]
runloop-core = { path = "../core" }
runloop-rmp = { path = "../rmp" }
runloop-kb = { path = "../kb" }
runloop-model-broker = { path = "../model-broker" }
runloop-bus = { path = "../bus" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync"] }
tracing = "0.1"
bytes = "1.6"
parking_lot = "0.12"
once_cell = "1.19"
dashmap = "5.5"
async-trait = "0.1"
toml = { version = "0.8", features = ["parse"] }
directories = "5.0"
camino = "1.1"
cfg-if = "1.0"
serde_json = "1.0"
wasmtime = { version = "38.0.3", features = ["cache", "cranelift"] }
wasmtime-wasi = "38.0.3"
libc = "0.2"
procfs = { version = "0.16", optional = true }
rustix = { version = "1.1", default-features = false, features = ["thread"] }
futures-util = "0.3"
url = "2.5"
sysinfo = { version = "0.30", default-features = false }
anyhow = "1.0"


[features]
default = ["procfs"]
procfs = ["dep:procfs"]
no-procfs = []

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.16", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
wat = "1.240.0"
tempfile = "3.10"
