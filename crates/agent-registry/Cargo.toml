[package]
name = "runloop-agent-registry"
version = "0.1.1"
edition = "2024"

[lib]
name = "runloop_agent_registry"

[dependencies]
runloop-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2.0"
blake3 = "1.8"
jsonschema = "0.40"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.24"
