[package]
name = "runloop-agent-registry"
version = "0.1.0"
edition = "2024"

[lib]
name = "runloop_agent_registry"

[dependencies]
runloop-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
blake3 = "1.5"
jsonschema = "0.33"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
